name: build-ios-unsigned
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode 26.x
        run: |
          APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APP" ]; then sudo xcode-select -s "$APP"; fi
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Install build tools
        run: brew install ninja llvm lld libarchive pkg-config meson

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build native deps
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          (cd deps/rclone-mobile && go get github.com/xtls/xray-core@v1.251202.0 && go mod tidy)
          ./deps/build_rclone_ios.sh

      - name: Fetch geo data
        run: |
          curl -fsSL -o /tmp/xray-macos.zip https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-macos-arm64-v8a.zip
          unzip -o /tmp/xray-macos.zip geoip.dat geosite.dat -d deps/resources

      - name: Prepare provider customization
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xcbuild.log 2>&1 || {
              tail -60 /tmp/xcbuild.log; exit 1; }
          tail -5 /tmp/xcbuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DD/Build/Products/Release-iphoneos/Minis.app"
          [ -d "$APP" ] || APP=$(find build/DD/Build/Products -name "Minis.app" -maxdepth 4 | head -1)
          echo "APP=$APP"
          ls -la "$APP"
          # A valid .app must carry an executable and an Info.plist; without
          # this check a failed compile silently ships an empty shell IPA.
          test -f "$APP/Info.plist" || { echo "missing Info.plist in $APP"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo "Minis")
          echo "executable name: $EXE"
          test -f "$APP/$EXE" || { echo "missing executable $EXE"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Minis-identity.ipa Payload
          ls -lh Minis-identity.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-identity-ipa
          path: Minis-identity.ipa
